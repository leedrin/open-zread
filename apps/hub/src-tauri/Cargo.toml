[package]
name = "open-zread-hub"
version = "0.1.0"
description = "Open Zread Hub desktop shell"
authors = ["Open Zread contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
serde_json = "1"
